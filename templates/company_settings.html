{% extends "base.html" %}{% block title %}Invoice Settings · Lead Desk{% endblock %}{% block content %}
<div class="page-header"><div><h1 class="page-title">Invoice settings</h1><p class="page-sub">Your default seller, bank and invoice details. These can be changed anytime.</p></div></div>
<form class="form-card invoice-settings" method="post">
<h2 class="section-title">Your company</h2><div class="form-row"><div class="form-group"><label>Company name</label><input name="name" value="{{ settings.name or '' }}" required></div><div class="form-group"><label>Invoice prefix</label><input name="invoice_prefix" value="{{ settings.invoice_prefix or 'QL' }}"></div></div>
<div class="form-group"><label>Registered address</label><textarea name="address_lines">{{ settings.address_lines or '' }}</textarea></div>
<div class="form-row"><div class="form-group"><label>GSTIN</label><input name="gstin" value="{{ settings.gstin or '' }}"></div><div class="form-group"><label>PAN</label><input name="pan" value="{{ settings.pan or '' }}"></div></div><div class="form-group"><label>Website</label><input name="website" value="{{ settings.website or '' }}"></div>
<h2 class="section-title">Bank details</h2><div class="form-row"><div class="form-group"><label>Account name</label><input name="bank_name" value="{{ settings.bank_name or '' }}"></div><div class="form-group"><label>IFSC</label><input name="ifsc" value="{{ settings.ifsc or '' }}"></div></div><div class="form-row"><div class="form-group"><label>Account number</label><input name="account_no" value="{{ settings.account_no or '' }}"></div><div class="form-group"><label>Bank / branch</label><input name="bank_branch" value="{{ settings.bank_branch or '' }}"></div></div><div class="form-group"><label>UPI ID</label><input name="upi_id" value="{{ settings.upi_id or '' }}"></div>
<h2 class="section-title">Defaults</h2><div class="form-group"><label>Default notes</label><textarea name="default_notes">{{ settings.default_notes or '' }}</textarea></div><div class="form-group"><label>Default terms (one per line)</label><textarea name="default_terms" rows="8">{{ settings.default_terms or '' }}</textarea></div><button class="btn btn-accent">Save settings</button>
</form>{% endblock %}
