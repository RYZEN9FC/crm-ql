{% extends "auth_base.html" %}
{% block title %}Set up · Lead Desk{% endblock %}
{% block content %}
<h1 class="auth-title">Welcome</h1>
<p class="auth-sub">No accounts exist yet. Authorize the first Customer Relations Manager using their Google account email.</p>
<form method="post" action="{{ url_for('setup') }}">
  <div class="form-group">
    <label>Your name</label>
    <input type="text" name="name" required autofocus>
  </div>
  <div class="form-group">
    <label>Google account email</label>
    <input type="email" name="email" autocomplete="email" placeholder="name@company.com" required>
  </div>
  <button type="submit" class="btn btn-accent btn-block">Authorize manager</button>
</form>
{% endblock %}
